name: 'AST Metrics analysis'
description: 'Prevent architectural regressions: analyzes pull requests and reports only new or worsened issues. Full analysis on push.'
author: 'Jean-François Lépine'
branding:
  icon: bar-chart
  color: blue

inputs:
  version:
    description: 'Version of AST Metrics to use (e.g. v0.28.0). Pinning a version is recommended for reproducible checks. Use "local" to reuse an ast-metrics binary already present in the PATH, instead of downloading a release (useful to test an unreleased build).'
    required: false
    default: 'latest'
  directory:
    description: 'Directory to analyze'
    required: false
    default: '.'
  base:
    description: 'Git reference to compare the pull request with. Default: the base branch of the pull request.'
    required: false
    default: ''
  fail-on:
    description: 'Fail the check when a regression of at least this severity is introduced: high, medium, any or never. Default: never (informative mode).'
    required: false
    default: 'never'
  comment:
    description: 'Post (and update) a single review comment on the pull request. Best effort: requires the pull-requests: write permission; silently falls back to the job summary otherwise (e.g. pull requests from forks).'
    required: false
    default: 'true'
  sarif:
    description: 'Upload regressions to GitHub code scanning as SARIF. Requires the security-events: write permission, and GitHub Advanced Security on private repositories. Note: code scanning alerts are reported by the GitHub Advanced Security bot and listed under the Security tab; for plain quality annotations, see the annotations input.'
    required: false
    default: 'false'
  annotations:
    description: 'Annotate the changed files with the new findings, directly from the workflow (no GitHub Advanced Security required). Set to false to avoid duplicates when sarif is enabled.'
    required: false
    default: 'true'
  html-artifact:
    description: 'Upload the full HTML report as a build artifact. Default: true on push, false on pull requests (auto).'
    required: false
    default: 'auto'
  max-findings:
    description: 'Maximum number of regressions displayed in the summary and the comment'
    required: false
    default: '5'

runs:
  using: 'composite'
  steps:

    - name: Checkout
      uses: actions/checkout@v4
      with:
        # Full history so the review can compute the merge-base with the target branch
        fetch-depth: 0

    - name: Install AST Metrics
      shell: bash
      env:
        AST_METRICS_VERSION: ${{ inputs.version }}
      run: |
        set -e
        if [ "${AST_METRICS_VERSION}" = "local" ]; then
            # Escape hatch to validate an unreleased build: a previous step is
            # expected to have put the binary in the PATH.
            if ! command -v ast-metrics > /dev/null 2>&1; then
                echo "::error::version: local requires an ast-metrics binary in the PATH, installed by a previous step"
                exit 1
            fi
            echo "Using the AST Metrics binary already in the PATH: $(command -v ast-metrics)"
            ast-metrics --version || true
            exit 0
        fi
        if [ -z "${AST_METRICS_VERSION}" ] || [ "${AST_METRICS_VERSION}" = "latest" ]; then
            VERSION=$(curl -s https://api.github.com/repos/halleck45/ast-metrics/releases/latest | grep tag_name | cut -d '"' -f 4)
        else
            VERSION="v$(echo "${AST_METRICS_VERSION}" | sed 's/^v//')"
        fi
        case "$(uname -m)" in
            aarch64|arm64) ARCH="arm64" ;;
            *) ARCH="x86_64" ;;
        esac
        echo "Installing AST Metrics ${VERSION} (${ARCH})"
        curl -fsSL "https://github.com/Halleck45/ast-metrics/releases/download/${VERSION}/ast-metrics_Linux_${ARCH}" -o /usr/local/bin/ast-metrics
        chmod +x /usr/local/bin/ast-metrics

    # ------------------------------------------------------------------
    # Pull request: differential review (only new or worsened issues)
    # ------------------------------------------------------------------

    - name: Review pull request
      id: review
      if: github.event_name == 'pull_request'
      shell: bash
      env:
        DIRECTORY_TO_ANALYZE: ${{ inputs.directory }}
        BASE_REF: ${{ inputs.base != '' && inputs.base || github.base_ref }}
        FAIL_ON: ${{ inputs.fail-on }}
        MAX_FINDINGS: ${{ inputs.max-findings }}
        WITH_SARIF: ${{ inputs.sarif }}
      run: |
        set -e
        git fetch origin "${BASE_REF}" --quiet || true

        SARIF_FLAG=""
        if [ "${WITH_SARIF}" = "true" ]; then
            SARIF_FLAG="--report-sarif=${RUNNER_TEMP}/ast-metrics-review.sarif"
        fi

        set +e
        ast-metrics review \
            --base "origin/${BASE_REF}" \
            --fail-on "${FAIL_ON}" \
            --max-findings "${MAX_FINDINGS}" \
            --report-markdown "${RUNNER_TEMP}/ast-metrics-review.md" \
            --report-json "${RUNNER_TEMP}/ast-metrics-review.json" \
            ${SARIF_FLAG} \
            "${DIRECTORY_TO_ANALYZE}"
        CODE=$?
        set -e

        if [ ! -f "${RUNNER_TEMP}/ast-metrics-review.md" ]; then
            echo "::error::AST Metrics review failed before producing a report"
            exit "${CODE}"
        fi

        # Publish the summary now; the quality gate verdict is enforced at the end,
        # after the comment and SARIF steps had a chance to run.
        cat "${RUNNER_TEMP}/ast-metrics-review.md" >> "$GITHUB_STEP_SUMMARY"
        echo "exit-code=${CODE}" >> "$GITHUB_OUTPUT"

    - name: Annotate pull request
      if: (github.event_name == 'pull_request') && inputs.annotations == 'true'
      continue-on-error: true
      shell: bash
      run: |
        # Workflow-command annotations: attributed to the workflow itself
        # (quality context), visible in the Files changed tab, and available
        # without GitHub Advanced Security. GitHub caps annotations at 10 per
        # type and per step; the SARIF upload remains the complete channel.
        REPORT="${RUNNER_TEMP}/ast-metrics-review.json"
        [ -f "${REPORT}" ] || exit 0
        jq -r '
            .regressions[]
            | [
                (if .severity == "high" then "error" else "warning" end),
                .file,
                ((.line // 0) | if . < 1 then 1 else . end),
                .rule,
                ((if (.subject // "") != "" then .subject + ": " else "" end) + .message)
              ]
            | @tsv
        ' "${REPORT}" | while IFS=$'\t' read -r level file line rule message; do
            echo "::${level} file=${file},line=${line},title=AST Metrics (${rule})::${message}"
        done

    - name: Comment pull request (best effort)
      if: (github.event_name == 'pull_request') && inputs.comment == 'true'
      continue-on-error: true
      uses: actions/github-script@v7
      with:
        script: |
          const fs = require('fs');
          const marker = '<!-- ast-metrics-review -->';
          const report = fs.readFileSync(`${process.env.RUNNER_TEMP}/ast-metrics-review.md`, 'utf8');
          const body = `${marker}\n${report}`;
          try {
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100,
            });
            const existing = comments.find(c => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
          } catch (error) {
            if (error.status === 403 || error.status === 404) {
              core.notice('AST Metrics could not comment on this pull request (read-only token, e.g. fork pull request or restricted workflow permissions). The report is available in the job summary. To enable comments, add "permissions: pull-requests: write" to the workflow.');
            } else {
              throw error;
            }
          }

    - name: Upload SARIF to code scanning
      if: (github.event_name == 'pull_request') && inputs.sarif == 'true'
      continue-on-error: true
      uses: github/codeql-action/upload-sarif@v3
      with:
        sarif_file: ${{ runner.temp }}/ast-metrics-review.sarif
        category: ast-metrics

    - name: Upload HTML report (pull request, optional)
      if: (github.event_name == 'pull_request') && inputs.html-artifact == 'true'
      shell: bash
      env:
        DIRECTORY_TO_ANALYZE: ${{ inputs.directory }}
      run: |
        set -e
        ast-metrics analyze --non-interactive --report-html="${RUNNER_TEMP}/ast-metrics-html-report" "${DIRECTORY_TO_ANALYZE}"

    - name: Upload HTML report artifact (pull request, optional)
      if: (github.event_name == 'pull_request') && inputs.html-artifact == 'true'
      uses: actions/upload-artifact@v4
      with:
        name: ast-metrics-report
        path: ${{ runner.temp }}/ast-metrics-html-report

    - name: Enforce quality gate
      if: github.event_name == 'pull_request'
      shell: bash
      env:
        CODE: ${{ steps.review.outputs.exit-code }}
      run: |
        if [ "${CODE}" != "0" ]; then
            echo "::error::AST Metrics quality gate failed (fail-on: ${{ inputs.fail-on }}). See the job summary for details."
            exit 1
        fi

    # ------------------------------------------------------------------
    # Push and other events: full analysis (v1 behavior)
    # ------------------------------------------------------------------

    - name: Analyze
      if: github.event_name != 'pull_request'
      shell: bash
      env:
        DIRECTORY_TO_ANALYZE: ${{ inputs.directory }}
      run: |
        set -e
        ast-metrics analyze \
            --non-interactive \
            --report-html="${RUNNER_TEMP}/ast-metrics-html-report" \
            --report-markdown="${RUNNER_TEMP}/ast-metrics-report.md" \
            "${DIRECTORY_TO_ANALYZE}"
        cat "${RUNNER_TEMP}/ast-metrics-report.md" >> "$GITHUB_STEP_SUMMARY"

    - name: Upload HTML report artifact
      if: github.event_name != 'pull_request' && inputs.html-artifact != 'false'
      uses: actions/upload-artifact@v4
      with:
        name: ast-metrics-report
        path: ${{ runner.temp }}/ast-metrics-html-report
