name: 'AST Metrics analysis'
description: 'Prevent architectural regressions: analyzes pull requests and reports only new or worsened issues. Full analysis on push.'
author: 'Jean-François Lépine'
branding:
  icon: bar-chart
  color: blue

inputs:
  version:
    description: 'Version of AST Metrics to use (e.g. v0.28.0). Pinning a version is recommended for reproducible checks. Use "local" to reuse an ast-metrics binary already present in the PATH, instead of downloading a release (useful to test an unreleased build).'
    required: false
    default: 'latest'
  directory:
    description: 'Single directory to analyze, from the repository root and with the root configuration. Ignored when directories is set.'
    required: false
    default: '.'
  directories:
    description: 'Independent project directories to analyze, one per line. Each project is analyzed from its own directory with its local AST Metrics configuration. Takes precedence over directory.'
    required: false
    default: ''
  only-changed:
    description: 'On pull requests, analyze only configured directories containing changed files. Applies to directory as well as to directories. Set to false to analyze every configured directory.'
    required: false
    default: 'true'
  base:
    description: 'Git reference to compare the pull request with. Default: the base branch of the pull request.'
    required: false
    default: ''
  fail-on:
    description: 'Fail the check when a regression of at least this severity is introduced: high, medium, any or never. Default: never (informative mode).'
    required: false
    default: 'never'
  comment:
    description: 'Post (and update) a single review comment on the pull request. Best effort: requires the pull-requests: write permission; silently falls back to the job summary otherwise (e.g. pull requests from forks).'
    required: false
    default: 'true'
  sarif:
    description: 'Upload regressions to GitHub code scanning as SARIF. Requires the security-events: write permission, and GitHub Advanced Security on private repositories. Note: code scanning alerts are reported by the GitHub Advanced Security bot and listed under the Security tab; for plain quality annotations, see the annotations input.'
    required: false
    default: 'false'
  sarif-max-level:
    description: 'Ceiling for the level of the SARIF results: error, warning or note. Default: warning, because code scanning fails its own pull request check as soon as a new error level alert appears in the diff, whatever fail-on says. Set to error to let code scanning block the pull request on high severity regressions.'
    required: false
    default: 'warning'
  annotations:
    description: 'Annotate the changed files with the new findings, directly from the workflow (no GitHub Advanced Security required). Default: auto, meaning enabled unless sarif is enabled, since code scanning already annotates the same findings. Use true to force both channels, false to disable.'
    required: false
    default: 'auto'
  html-artifact:
    description: 'Upload the full HTML report as a build artifact. Default: true on push, false on pull requests (auto).'
    required: false
    default: 'auto'
  max-findings:
    description: 'Maximum number of regressions displayed per analyzed project in the summary and the comment'
    required: false
    default: '5'

runs:
  using: 'composite'
  steps:

    - name: Checkout
      uses: actions/checkout@v4
      with:
        # Full history so the review can compute the merge-base with the target branch
        fetch-depth: 0

    - name: Fetch pull request base
      if: github.event_name == 'pull_request'
      shell: bash
      env:
        BASE_REF: ${{ inputs.base != '' && inputs.base || github.base_ref }}
      run: git fetch --quiet origin "${BASE_REF}" || true

    - name: Select directories to analyze
      id: scope
      shell: bash
      env:
        DIRECTORY: ${{ inputs.directory }}
        DIRECTORIES: ${{ inputs.directories }}
        ONLY_CHANGED: ${{ inputs.only-changed }}
        EVENT_NAME: ${{ github.event_name }}
        BASE_REF: ${{ inputs.base != '' && inputs.base || github.base_ref }}
        BEFORE_SHA: ${{ github.event.before }}
      run: bash "${GITHUB_ACTION_PATH}/scripts/select-directories.sh"

    - name: Report skipped analysis
      if: (github.event_name == 'pull_request') && steps.scope.outputs.has-directories != 'true'
      shell: bash
      env:
        WITH_SARIF: ${{ inputs.sarif }}
      run: |
        cat > "${RUNNER_TEMP}/ast-metrics-review.md" <<'EOF'
        ## AST Metrics: analysis skipped

        No configured directory requires analysis for this pull request.
        EOF
        cat "${RUNNER_TEMP}/ast-metrics-review.md" >> "${GITHUB_STEP_SUMMARY}"
        if [ "${WITH_SARIF}" = "true" ]; then
            cat > "${RUNNER_TEMP}/ast-metrics-review.sarif" <<'EOF'
        {
          "$schema": "https://json.schemastore.org/sarif-2.1.0.json",
          "version": "2.1.0",
          "runs": [{"tool": {"driver": {"name": "AST Metrics"}}, "results": []}]
        }
        EOF
        fi

    - name: Install AST Metrics
      if: steps.scope.outputs.has-directories == 'true'
      shell: bash
      env:
        AST_METRICS_VERSION: ${{ inputs.version }}
      run: |
        set -e
        if [ "${AST_METRICS_VERSION}" = "local" ]; then
            # Escape hatch to validate an unreleased build: a previous step is
            # expected to have put the binary in the PATH.
            if ! command -v ast-metrics > /dev/null 2>&1; then
                echo "::error::version: local requires an ast-metrics binary in the PATH, installed by a previous step"
                exit 1
            fi
            echo "Using the AST Metrics binary already in the PATH: $(command -v ast-metrics)"
            ast-metrics --version || true
            exit 0
        fi
        if [ -z "${AST_METRICS_VERSION}" ] || [ "${AST_METRICS_VERSION}" = "latest" ]; then
            # -L matters: the repository moved to the ast-metrics organization and
            # the API answers a redirect, whose body carries no tag_name.
            VERSION=$(curl -fsSL https://api.github.com/repos/ast-metrics/ast-metrics/releases/latest | jq -r '.tag_name // empty')
            if [ -z "${VERSION}" ]; then
                echo "::error::Cannot resolve the latest AST Metrics release (GitHub API rate limit?). Pin the version input to a known release."
                exit 1
            fi
        else
            VERSION="v$(echo "${AST_METRICS_VERSION}" | sed 's/^v//')"
        fi
        case "$(uname -m)" in
            aarch64|arm64) ARCH="arm64" ;;
            *) ARCH="x86_64" ;;
        esac
        echo "Installing AST Metrics ${VERSION} (${ARCH})"
        curl -fsSL "https://github.com/ast-metrics/ast-metrics/releases/download/${VERSION}/ast-metrics_Linux_${ARCH}" -o /usr/local/bin/ast-metrics
        chmod +x /usr/local/bin/ast-metrics

    # ------------------------------------------------------------------
    # Pull request: differential review (only new or worsened issues)
    # ------------------------------------------------------------------

    - name: Review pull request
      id: review
      if: (github.event_name == 'pull_request') && steps.scope.outputs.has-directories == 'true'
      shell: bash
      env:
        DIRECTORIES_FILE: ${{ steps.scope.outputs.directories-file }}
        ISOLATED: ${{ steps.scope.outputs.isolated }}
        BASE_REF: ${{ steps.scope.outputs.base-ref }}
        FAIL_ON: ${{ inputs.fail-on }}
        MAX_FINDINGS: ${{ inputs.max-findings }}
        WITH_SARIF: ${{ inputs.sarif }}
        SARIF_MAX_LEVEL: ${{ inputs.sarif-max-level }}
      run: |
        set -e
        MODE=review bash "${GITHUB_ACTION_PATH}/scripts/run-directories.sh"

        # The quality gate verdict is enforced at the end, after the comment
        # and SARIF steps had a chance to run.
        cat "${RUNNER_TEMP}/ast-metrics-review.md" >> "$GITHUB_STEP_SUMMARY"

    - name: Annotate pull request
      if: (github.event_name == 'pull_request') && steps.scope.outputs.has-directories == 'true' && (inputs.annotations == 'true' || (inputs.annotations == 'auto' && inputs.sarif != 'true'))
      continue-on-error: true
      shell: bash
      run: |
        # Workflow-command annotations: attributed to the workflow itself
        # (quality context), visible in the Files changed tab, and available
        # without GitHub Advanced Security. GitHub caps annotations at 10 per
        # type and per step; the SARIF upload remains the complete channel.
        # Skipped by default when SARIF is on: code scanning would annotate the
        # very same findings, and both channels together read as duplicates.
        REPORT="${RUNNER_TEMP}/ast-metrics-review.json"
        [ -f "${REPORT}" ] || exit 0
        jq -r '
            .regressions[]
            | [
                (if .severity == "high" then "error" else "warning" end),
                .file,
                ((.line // 0) | if . < 1 then 1 else . end),
                .rule,
                ((if (.subject // "") != "" then .subject + ": " else "" end) + .message)
              ]
            | @tsv
        ' "${REPORT}" | while IFS=$'\t' read -r level file line rule message; do
            echo "::${level} file=${file},line=${line},title=AST Metrics (${rule})::${message}"
        done

    - name: Comment pull request (best effort)
      if: (github.event_name == 'pull_request') && inputs.comment == 'true'
      continue-on-error: true
      uses: actions/github-script@v7
      with:
        script: |
          const fs = require('fs');
          const marker = '<!-- ast-metrics-review -->';
          const report = fs.readFileSync(`${process.env.RUNNER_TEMP}/ast-metrics-review.md`, 'utf8');
          // A monorepo applies max-findings per project, so the combined report
          // can outgrow the 65536 character limit of a comment body. The job
          // summary is not capped and always carries the whole report.
          const limit = 65536;
          const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
          const truncationNotice = `\n\n_Report truncated. The complete report is in the [job summary](${runUrl})._\n`;
          let body = `${marker}\n${report}`;
          if (body.length > limit) {
            body = body.slice(0, limit - truncationNotice.length) + truncationNotice;
          }
          try {
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100,
            });
            const existing = comments.find(c => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
          } catch (error) {
            if (error.status === 403 || error.status === 404) {
              core.notice('AST Metrics could not comment on this pull request (read-only token, e.g. fork pull request or restricted workflow permissions). The report is available in the job summary. To enable comments, add "permissions: pull-requests: write" to the workflow.');
            } else {
              throw error;
            }
          }

    - name: Upload SARIF to code scanning
      if: (github.event_name == 'pull_request') && inputs.sarif == 'true'
      continue-on-error: true
      uses: github/codeql-action/upload-sarif@v3
      with:
        sarif_file: ${{ runner.temp }}/ast-metrics-review.sarif
        category: ast-metrics

    - name: Upload HTML report (pull request, optional)
      if: (github.event_name == 'pull_request') && steps.scope.outputs.has-directories == 'true' && inputs.html-artifact == 'true'
      shell: bash
      env:
        DIRECTORIES_FILE: ${{ steps.scope.outputs.directories-file }}
        ISOLATED: ${{ steps.scope.outputs.isolated }}
      run: |
        set -e
        MODE=html bash "${GITHUB_ACTION_PATH}/scripts/run-directories.sh"

    - name: Upload HTML report artifact (pull request, optional)
      if: (github.event_name == 'pull_request') && steps.scope.outputs.has-directories == 'true' && inputs.html-artifact == 'true'
      uses: actions/upload-artifact@v4
      with:
        name: ast-metrics-report
        path: ${{ runner.temp }}/ast-metrics-html-report

    - name: Enforce quality gate
      if: (github.event_name == 'pull_request') && steps.scope.outputs.has-directories == 'true'
      shell: bash
      env:
        CODE: ${{ steps.review.outputs.exit-code }}
      run: |
        if [ "${CODE}" != "0" ]; then
            echo "::error::AST Metrics quality gate failed (fail-on: ${{ inputs.fail-on }}). See the job summary for details."
            exit 1
        fi

    # ------------------------------------------------------------------
    # Push and other events: full analysis (v1 behavior)
    # ------------------------------------------------------------------

    - name: Analyze
      if: github.event_name != 'pull_request' && steps.scope.outputs.has-directories == 'true'
      shell: bash
      env:
        DIRECTORIES_FILE: ${{ steps.scope.outputs.directories-file }}
        ISOLATED: ${{ steps.scope.outputs.isolated }}
      run: |
        set -e
        MODE=analyze bash "${GITHUB_ACTION_PATH}/scripts/run-directories.sh"
        cat "${RUNNER_TEMP}/ast-metrics-report.md" >> "$GITHUB_STEP_SUMMARY"

    - name: Upload HTML report artifact
      if: github.event_name != 'pull_request' && steps.scope.outputs.has-directories == 'true' && inputs.html-artifact != 'false'
      uses: actions/upload-artifact@v4
      with:
        name: ast-metrics-report
        path: ${{ runner.temp }}/ast-metrics-html-report
