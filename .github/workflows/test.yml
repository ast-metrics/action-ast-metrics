name: Test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ./

      - name: Assertions
        shell: bash
        run: |
          set -e
          if [ "${GITHUB_EVENT_NAME}" = "pull_request" ]; then
              # Review mode must have produced its reports
              test -f "${RUNNER_TEMP}/ast-metrics-review.md"
              test -f "${RUNNER_TEMP}/ast-metrics-review.json"
              grep -q "methodologyVersion" "${RUNNER_TEMP}/ast-metrics-review.json"
          else
              # Full analysis mode must have produced the HTML report
              test -d "${RUNNER_TEMP}/ast-metrics-html-report"
          fi
